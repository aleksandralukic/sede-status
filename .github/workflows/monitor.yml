# Checks the seeds on a tiered schedule, rebuilds the static site, deploys
# to GitHub Pages, and commits checks.db/status.json back so failure history
# (the 3-consecutive rule) survives between runs.
#
# Repo settings needed once:
#   Settings > Pages > Source: "GitHub Actions"
#   Settings > Actions > Variables: BASE_URL = https://<your-domain>  (set it
#   only when the domain is live; without it every page ships noindex)
#   Optionally SITE_NAME.

name: monitor

on:
  schedule:
    - cron: "30 3 * * *"   # full run, daily. 03:30 UTC sits inside the
                           # administracion.gob.es robots visit window
                           # (01:00-06:45 GMT).
    - cron: "15 * * * *"   # watch tier: the 8 flaky high-traffic sedes, hourly
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run checks
        run: |
          if [ "${{ github.event.schedule }}" = "15 * * * *" ]; then
            python check.py --watch
          else
            python check.py
          fi

      - name: Build site
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          SITE_NAME: ${{ vars.SITE_NAME }}
        run: python build_site.py

      - name: Commit check history
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add checks.db status.json
          git commit -m "chore: checks $(date -u +'%Y-%m-%d %H:%M')" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: check-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
